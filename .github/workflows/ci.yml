name: ColiDev CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colidev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run backend test suite
        env:
          OBSIDIAN_API_KEY: ""
          OLLAMA_URL: http://127.0.0.1:11434
          SESSION_MAX_PER_DAY: "5"
        run: python -m pytest 01_Projects -q

  macos-build:
    name: macOS app build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python for the Keychain backend
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and verify the macOS Keychain provider
        run: |
          python -m pip install -r requirements-macos-runtime.txt
          python -c 'from keyring.backends.macOS import Keyring; assert Keyring'

      - name: Verify shared physics calculation models
        run: |
          swiftc macOS/ColiDev/App/ForceMotion.swift macOS/ColiDev/scripts/verify_physics_models.swift \
            -o "$RUNNER_TEMP/verify-physics-models"
          "$RUNNER_TEMP/verify-physics-models"
          swiftc macOS/ColiDev/App/ForceMotion.swift macOS/ColiDev/scripts/verify_friction_motion.swift \
            -o "$RUNNER_TEMP/verify-friction-motion"
          "$RUNNER_TEMP/verify-friction-motion"
          swiftc macOS/ColiDev/App/LengthMeasurement.swift macOS/ColiDev/scripts/verify_length_measurement.swift \
            -o "$RUNNER_TEMP/verify-length-measurement"
          "$RUNNER_TEMP/verify-length-measurement"

      - name: Verify shared linear equation model
        run: |
          swiftc macOS/ColiDev/App/LinearEquation.swift macOS/ColiDev/scripts/verify_linear_equation_model.swift \
            -o "$RUNNER_TEMP/verify-linear-equation-model"
          "$RUNNER_TEMP/verify-linear-equation-model"

      - name: Verify fraction and percent representation model
        run: |
          swiftc macOS/ColiDev/App/PercentRepresentation.swift macOS/ColiDev/scripts/verify_percent_representation.swift \
            -o "$RUNNER_TEMP/verify-percent-representation"
          "$RUNNER_TEMP/verify-percent-representation"
          swiftc macOS/ColiDev/App/GeometryMeasure.swift macOS/ColiDev/scripts/verify_geometry_measure.swift \
            -o "$RUNNER_TEMP/verify-geometry-measure"
          "$RUNNER_TEMP/verify-geometry-measure"

      - name: Verify programming loop trace model
        run: |
          swiftc macOS/ColiDev/App/LoopTrace.swift macOS/ColiDev/scripts/verify_loop_trace.swift \
            -o "$RUNNER_TEMP/verify-loop-trace"
          "$RUNNER_TEMP/verify-loop-trace"

      - name: Verify answer choice order / Проверка порядка вариантов
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/scripts/verify_answer_choice_order.swift \
            -o "$RUNNER_TEMP/verify-answer-choice-order"
          "$RUNNER_TEMP/verify-answer-choice-order"

      - name: Verify adaptive study recommendation / Проверка следующего шага обучения
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/StudyRecommendation.swift macOS/ColiDev/App/CustomCurriculum.swift macOS/ColiDev/scripts/verify_study_recommendation.swift \
            -o "$RUNNER_TEMP/verify-study-recommendation"
          "$RUNNER_TEMP/verify-study-recommendation"

      - name: Verify user-created curriculum / Проверка пользовательских курсов
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/CustomCurriculum.swift macOS/ColiDev/scripts/verify_custom_curriculum.swift \
            -o "$RUNNER_TEMP/verify-custom-curriculum"
          "$RUNNER_TEMP/verify-custom-curriculum"

      - name: Verify programming file-reading practice model
        run: |
          swiftc macOS/ColiDev/App/FileReadingPractice.swift macOS/ColiDev/scripts/verify_file_reading_practice.swift \
            -o "$RUNNER_TEMP/verify-file-reading-practice"
          "$RUNNER_TEMP/verify-file-reading-practice"

      - name: Verify programming debugging practice model
        run: |
          swiftc macOS/ColiDev/App/DebuggingPractice.swift macOS/ColiDev/scripts/verify_debugging_practice.swift \
            -o "$RUNNER_TEMP/verify-debugging-practice"
          "$RUNNER_TEMP/verify-debugging-practice"

      - name: Verify programming transaction practice model
        run: |
          swiftc macOS/ColiDev/App/TransactionPractice.swift macOS/ColiDev/scripts/verify_transaction_practice.swift \
            -o "$RUNNER_TEMP/verify-transaction-practice"
          "$RUNNER_TEMP/verify-transaction-practice"

      - name: Verify biology experiment and food-web models
        run: |
          swiftc macOS/ColiDev/App/BiologyInvestigation.swift macOS/ColiDev/scripts/verify_biology_investigation.swift \
            -o "$RUNNER_TEMP/verify-biology-investigation"
          "$RUNNER_TEMP/verify-biology-investigation"

      - name: Verify gene expression model
        run: |
          swiftc macOS/ColiDev/App/GeneExpression.swift macOS/ColiDev/scripts/verify_gene_expression.swift \
            -o "$RUNNER_TEMP/verify-gene-expression"
          "$RUNNER_TEMP/verify-gene-expression"

      - name: Verify cell-cycle practice model
        run: |
          swiftc macOS/ColiDev/App/CellCyclePractice.swift macOS/ColiDev/scripts/verify_cell_cycle_practice.swift \
            -o "$RUNNER_TEMP/verify-cell-cycle-practice"
          "$RUNNER_TEMP/verify-cell-cycle-practice"

      - name: Verify animal function practice model
        run: |
          swiftc macOS/ColiDev/App/AnimalFunctionPractice.swift macOS/ColiDev/scripts/verify_animal_function_practice.swift \
            -o "$RUNNER_TEMP/verify-animal-function-practice"
          "$RUNNER_TEMP/verify-animal-function-practice"

      - name: Verify English conditional practice model
        run: |
          swiftc macOS/ColiDev/App/EnglishLearningModels.swift macOS/ColiDev/scripts/verify_english_learning_models.swift \
            -o "$RUNNER_TEMP/verify-english-learning-models"
          "$RUNNER_TEMP/verify-english-learning-models"

      - name: Verify rational expression domain model
        run: |
          swiftc macOS/ColiDev/App/RationalExpression.swift macOS/ColiDev/scripts/verify_rational_expression.swift \
            -o "$RUNNER_TEMP/verify-rational-expression"
          "$RUNNER_TEMP/verify-rational-expression"

      - name: Verify algorithm complexity model
        run: |
          swiftc macOS/ColiDev/App/AlgorithmComplexity.swift macOS/ColiDev/scripts/verify_algorithm_complexity.swift \
            -o "$RUNNER_TEMP/verify-algorithm-complexity"
          "$RUNNER_TEMP/verify-algorithm-complexity"

      - name: Verify linear system practice model
        run: |
          swiftc macOS/ColiDev/App/LinearSystemPractice.swift macOS/ColiDev/scripts/verify_linear_system_practice.swift \
            -o "$RUNNER_TEMP/verify-linear-system-practice"
          "$RUNNER_TEMP/verify-linear-system-practice"

      - name: Verify safe official citation links
        run: |
          swiftc macOS/ColiDev/App/SafeWebReferenceURL.swift macOS/ColiDev/scripts/verify_safe_web_reference_url.swift \
            -o "$RUNNER_TEMP/verify-safe-web-reference-url"
          "$RUNNER_TEMP/verify-safe-web-reference-url"

      - name: Build ColiDev for macOS
        run: >-
          xcodebuild
          -project macOS/ColiDev/ColiDev.xcodeproj
          -scheme ColiDev
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ColiDevDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Embed the local backend runtime in the app
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          ./macOS/ColiDev/scripts/package_backend_runtime.sh "$app"

      - name: Smoke test the bundled local backend
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          ./macOS/ColiDev/scripts/smoke_test_backend_runtime.sh "$app"

      - name: Verify bundled curriculum roadmaps
        run: |
          resources="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app/Contents/Resources/02_Areas"
          test -x "$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app/Contents/Resources/ColiDevBackend/ColiDevBackend"
          for subject in Mathematics English Physics Biology Zoology Programming; do
            test -s "$resources/$subject/curriculum.md"
          done
          while IFS=: read -r subject lesson; do
            test -s "$resources/$subject/lessons/$lesson.md"
          done <<'LESSONS'
          Mathematics:functions_as_models
          Mathematics:domain_and_range
          Mathematics:rates_of_change_and_derivative
          Mathematics:solving_linear_equations
          Mathematics:numbers_fractions_and_percentages
          Mathematics:geometry_area_perimeter
          English:present_simple_and_continuous
          English:present_perfect_simple_continuous
          English:reading_for_gist_and_detail
          English:daily_routines_and_collocations
          English:zero_first_second_conditionals
          Physics:net_force_and_acceleration
          Physics:static_and_kinetic_friction
          Physics:measurement_units_and_uncertainty
          Physics:motion_with_constant_acceleration
          Physics:projectile_motion
          Physics:work_and_kinetic_energy
          Physics:impulse_and_momentum
          Physics:elastic_collisions
          Biology:passive_transport_osmosis
          Biology:scientific_method_and_experiments
          Biology:photosynthesis_energy_and_carbon
          Biology:mendelian_inheritance
          Biology:dna_genes_and_traits
          Biology:eukaryotic_cell_organelles
          Biology:biomolecules_and_building_blocks
          Biology:natural_selection_and_population_change
          Biology:ecosystem_energy_flow
          Biology:food_webs_and_matter_cycles
          Zoology:adaptation_and_behavior
          Zoology:animals_as_a_group
          Zoology:major_animal_lineages
          Zoology:symmetry_and_body_plans
          Zoology:comparative_gas_exchange_and_circulation
          Programming:computational_thinking
          Programming:conditions_loops_functions
          Programming:strings_files_and_exceptions
          Programming:collections_and_loops
          Programming:variables_and_types
          LESSONS

      - name: Package macOS app archive
        id: package
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          arch="$(uname -m)"
          archive="$RUNNER_TEMP/ColiDev-${arch}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app archive
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ColiDev-macos-${{ steps.package.outputs.arch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
