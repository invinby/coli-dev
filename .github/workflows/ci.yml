name: ColiDev CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colidev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run backend test suite
        env:
          OBSIDIAN_API_KEY: ""
          OLLAMA_URL: http://127.0.0.1:11434
          SESSION_MAX_PER_DAY: "5"
        run: python -m pytest 01_Projects -q

  macos-build:
    name: macOS app build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python for the Keychain backend
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and verify the macOS Keychain provider
        run: |
          python -m pip install -r requirements-macos-runtime.txt
          python -c 'from keyring.backends.macOS import Keyring; assert Keyring'

      - name: Verify shared physics calculation models
        run: |
          swiftc macOS/ColiDev/App/ForceMotion.swift macOS/ColiDev/scripts/verify_physics_models.swift \
            -o "$RUNNER_TEMP/verify-physics-models"
          "$RUNNER_TEMP/verify-physics-models"

      - name: Verify shared linear equation model
        run: |
          swiftc macOS/ColiDev/App/LinearEquation.swift macOS/ColiDev/scripts/verify_linear_equation_model.swift \
            -o "$RUNNER_TEMP/verify-linear-equation-model"
          "$RUNNER_TEMP/verify-linear-equation-model"

      - name: Verify biology experiment design model
        run: |
          swiftc macOS/ColiDev/App/BiologyInvestigation.swift macOS/ColiDev/scripts/verify_biology_investigation.swift \
            -o "$RUNNER_TEMP/verify-biology-investigation"
          "$RUNNER_TEMP/verify-biology-investigation"

      - name: Build ColiDev for macOS
        run: >-
          xcodebuild
          -project macOS/ColiDev/ColiDev.xcodeproj
          -scheme ColiDev
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ColiDevDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Embed the local backend runtime in the app
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          ./macOS/ColiDev/scripts/package_backend_runtime.sh "$app"

      - name: Smoke test the bundled local backend
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          ./macOS/ColiDev/scripts/smoke_test_backend_runtime.sh "$app"

      - name: Verify bundled curriculum roadmaps
        run: |
          resources="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app/Contents/Resources/02_Areas"
          test -x "$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app/Contents/Resources/ColiDevBackend/ColiDevBackend"
          for subject in Mathematics English Physics Biology Zoology Programming; do
            test -s "$resources/$subject/curriculum.md"
          done
          while IFS=: read -r subject lesson; do
            test -s "$resources/$subject/lessons/$lesson.md"
          done <<'LESSONS'
          Mathematics:functions_as_models
          Mathematics:domain_and_range
          Mathematics:rates_of_change_and_derivative
          Mathematics:solving_linear_equations
          English:present_simple_and_continuous
          English:present_perfect_simple_continuous
          English:reading_for_gist_and_detail
          Physics:net_force_and_acceleration
          Physics:motion_with_constant_acceleration
          Physics:projectile_motion
          Physics:work_and_kinetic_energy
          Physics:impulse_and_momentum
          Physics:elastic_collisions
          Biology:passive_transport_osmosis
          Biology:scientific_method_and_experiments
          Biology:photosynthesis_energy_and_carbon
          Biology:mendelian_inheritance
          Biology:dna_genes_and_traits
          Biology:eukaryotic_cell_organelles
          Zoology:adaptation_and_behavior
          Zoology:symmetry_and_body_plans
          Zoology:comparative_gas_exchange_and_circulation
          Programming:computational_thinking
          Programming:conditions_loops_functions
          Programming:collections_and_loops
          Programming:variables_and_types
          LESSONS

      - name: Package macOS app archive
        id: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          arch="$(uname -m)"
          archive="$RUNNER_TEMP/ColiDev-${arch}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app archive
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ColiDev-macos-${{ steps.package.outputs.arch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
