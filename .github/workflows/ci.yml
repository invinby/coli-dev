name: ColiDev CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colidev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run backend test suite
        env:
          OBSIDIAN_API_KEY: ""
          OLLAMA_URL: http://127.0.0.1:11434
          SESSION_MAX_PER_DAY: "5"
        run: python -m pytest 01_Projects -q

  macos-build:
    name: macOS app build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ColiDev for macOS
        run: >-
          xcodebuild
          -project macOS/ColiDev/ColiDev.xcodeproj
          -scheme ColiDev
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ColiDevDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
